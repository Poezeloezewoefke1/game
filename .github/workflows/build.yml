name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: plugin
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FunCraftGames
          path: plugin/build/libs/FunCraftGames.jar

  # Boots a real Paper server with the plugin and generates every map once.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.21.11"
            bots: "1.21.11"
          - version: "LATEST"
            bots: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FunCraftGames
          path: plugins
      - name: Start server
        run: |
          docker run -d --name mc -p 25565:25565 \
            -e EULA=TRUE -e TYPE=PAPER -e VERSION=${{ matrix.version }} -e MEMORY=3G \
            -e ONLINE_MODE=FALSE -e GENERATE_STRUCTURES=FALSE \
            -v "$PWD/plugins:/plugins:ro" itzg/minecraft-server:latest
      - name: Wait for startup
        run: |
          for i in $(seq 1 120); do
            if docker logs mc 2>&1 | grep -q 'Done ('; then echo "Server is up"; exit 0; fi
            if ! docker ps -q -f name=mc | grep -q .; then docker logs mc; exit 1; fi
            sleep 5
          done
          docker logs mc; exit 1
      - name: Plugin enabled
        run: docker logs mc 2>&1 | grep 'FunCraft Games enabled'
      - name: Generate every map (/fc selftest)
        run: |
          docker exec mc rcon-cli fc selftest
          for i in $(seq 1 60); do
            docker logs mc 2>&1 | grep -q 'SELFTEST RESULT' && break
            sleep 2
          done
          docker logs mc 2>&1 | grep -E 'SELFTEST RESULT|Selftest failed'
          docker logs mc 2>&1 | grep -q 'SELFTEST RESULT 8/8'
      - name: Bot play-through
        if: matrix.bots != 'none'
        env:
          MC_VERSION: ${{ matrix.bots }}
        run: |
          cd test
          npm install --no-audit --no-fund
          node bot-test.js
      - name: No plugin errors in the log
        if: always()
        run: |
          docker logs mc > server.log 2>&1
          if grep -nE 'net\.funcraft|FunCraftGames' server.log | grep -iE 'exception|error|severe'; then
            echo "Plugin errors found:"; grep -nE -B2 -A15 'Exception' server.log | head -200; exit 1
          fi
          echo "No plugin errors."
      - name: Server log
        if: always()
        run: docker logs mc 2>&1 | tail -300

  release:
    needs: server-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FunCraftGames
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest FunCraftGames.jar -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FunCraft Games (latest build)" \
            --notes "Automatic build of the latest commit on main. Drop FunCraftGames.jar into your server's plugins folder."
