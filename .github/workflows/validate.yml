name: Validate

# Static structure checks, a full headless Godot validation run, and a real
# multi-process multiplayer check.
#
# What this workflow CAN prove: the project imports, every script compiles,
# every scene instantiates, the automated tests pass, a host plus three clients
# complete a session over real ENet, and one player can walk the whole game
# from the main menu to extraction using nothing but simulated input.
# What it CANNOT prove: that the game looks or feels right, or that a Windows
# build launches. Those stay manual - see docs/TEST_CHECKLIST.md.

on:
  push:
    branches:
      - claude/starbound-station-dev-62c8jv
      - claude/development
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The single source of truth for the engine version. tools/check_structure.sh
  # asserts that build-windows.yml pins exactly the same value.
  GODOT_VERSION: "4.5.1-stable"

jobs:
  validate:
    name: Headless validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # First-party GitHub action, pinned to a major version.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Cache the Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          FILE="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fsSL -o "/tmp/${FILE}.zip" "${BASE}/${FILE}.zip"
          unzip -q "/tmp/${FILE}.zip" -d .godot-bin
          chmod +x ".godot-bin/${FILE}"

      - name: Report the engine version actually in use
        run: |
          set -euo pipefail
          GODOT=".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=${GODOT}" >> "$GITHUB_ENV"
          "${GODOT}" --headless --version

      - name: Repository structure and hygiene
        run: tools/check_structure.sh

      # One script so CI and a developer's machine run byte-identical checks.
      # It also fails on engine-level errors the test runner cannot see -
      # GDScript has no hook on the engine error stream, so a SCRIPT ERROR
      # inside a test is printed while the suite still reports PASS.
      - name: Import, validate and run automated tests
        run: tools/run_validation.sh "${GODOT_BIN}"

      - name: Multi-process multiplayer check
        run: tools/run_multiplayer_check.sh "${GODOT_BIN}" 7700 3

      # The only check here that asks whether the game can be PLAYED. Everything
      # above drives the game through its own API, which proves the rules are
      # right and says nothing about whether a player can walk to the thing the
      # rules are about. This boots the shipped shell and moves a player with
      # Input.action_press() and a synthetic mouse, start to finish. It has
      # already caught a prop standing in the only route back from an objective,
      # a swallowed first press of E, and an interact ray that reported nothing
      # while the player stood inside the console - none of which the 1470
      # assertions above could see.
      - name: Automated playtest (simulated keyboard and mouse)
        run: tools/run_playtest.sh "${GODOT_BIN}" cautious

      - name: Upload logs
        # Logs are most valuable exactly when something failed.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn
