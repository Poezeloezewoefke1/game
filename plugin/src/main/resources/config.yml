# FunCraft Games configuration. Change values and run /fc reload (or restart).

# Shown in the sidebar title and on join.
server-name: "FunCraft"
# Last line of the sidebar (MiniMessage format: https://docs.advntr.dev/minimessage/format.html)
sidebar-footer: "<gold>Have fun!"

# Seconds a queue counts down once it has enough players (drops to 5 when the game is full).
countdown-seconds: 20

anticheat:
  # Flags Fly, Speed, Reach, KillAura, AutoClicker, FastPlace and FastBreak/Nuker.
  # Ops see alerts (toggle with /fc ac alerts). Movement cheats are set back.
  enabled: true
  # Kick players whose violation level for one check reaches kick-vl.
  kick: true
  kick-vl: 40

bots:
  # Bots are fake players (no account needed). They hang out in the hub and join a queue when
  # real players are waiting in it, so games can start with only one or two people online.
  # They never count for stats or leaderboards. Manage them with /fc bots.
  enabled: true
  # Bots that are always online in the hub.
  hub: 4
  # A queue with at least one real player gets topped up with bots until it has this many
  # players (or the game's minimum, whichever is higher).
  fill-to: 4
  # Most bots online at once.
  max: 16
  fill-queues: true

ffa:
  # How long the /fc ffa kit vote lasts.
  vote-seconds: 30

games:
  bedwars:
    enabled: true
    min-players: 2
    max-players: 8
  skywars:
    enabled: true
    min-players: 2
    max-players: 8
  buildbattle:
    enabled: true
    min-players: 2
    max-players: 12
    build-seconds: 300
    vote-seconds: 15
    # Leave empty to use the built-in list of 40 themes.
    themes: []
  pvp:
    enabled: true
    min-players: 2
    max-players: 12
    # Kit from kits.yml used by the PvP Arena queue.
    kit: classic
  duels:
