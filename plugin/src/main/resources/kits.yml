# PvP kits used by the PvP Arena, Duels and the /fc ffa kit-vote event.
#
# Item format: "<material> [xCOUNT] [enchantment:level ...] [potion:<potion type>]"
# Slots: 0-8 = hotbar, 9-35 = main inventory. Armor/offhand have their own keys.
#
# The kits below (everything except "classic") follow the MCTiers default kit layouts,
# as collected in https://github.com/HelixCraft/Minecraft-PVP-Kits - thanks!
# Add, change or remove kits freely, then run /fc reload.

